
name: studentfeedback-minio

services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: studentfeedback-minio
    restart: unless-stopped

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    volumes:
      - minio_data:/data

volumes:
  minio_data:
